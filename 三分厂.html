<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>密室逃脱：三分厂</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    background:#000; overflow:hidden;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    position:fixed;
  }
  body { display:flex; align-items:center; justify-content:center; }
  #game {
    display:block;
    width: min(100vw, 150vh);
    height: auto;
    max-height: 100vh;
    box-shadow: 0 0 80px rgba(0,0,0,0.95);
    background:#000;
    touch-action: none;
  }
  /* 竖屏提示 */
  #rotateHint {
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.88);
    color:#ffd24f;
    z-index:2000;
    align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    font-size:18px;
    line-height:1.8;
  }
  #rotateHint .big { font-size:44px; margin-bottom:16px; }
  @media (orientation:portrait) and (max-width: 700px) {
    #rotateHint { display:flex; }
  }

  /* 电子锁面板 */
  #lockPanel {
    display:none;
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(180deg,#2a3238 0%,#1a1e24 100%);
    padding:22px 26px 18px;
    border-radius:14px;
    box-shadow:0 0 80px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.08);
    border:2px solid #4a525a;
    z-index:1000;
    text-align:center;
    max-width: 92vw;
  }
  #lockPanel .lk-title { color:#c9d2da; font-size:17px; font-weight:bold; letter-spacing:4px; margin-bottom:4px; }
  #lockPanel .lk-sub { color:#8a94a0; font-size:12px; margin-bottom:14px; }
  #lockPanel .lk-led { display:inline-block; width:8px; height:8px; border-radius:50%; background:#2ecc71; box-shadow:0 0 10px #2ecc71; margin-right:6px; vertical-align:middle; }
  #lockInput {
    display:block; width:min(240px, 72vw); padding:12px 14px;
    font-size:18px; background:#0e1216; color:#4ade80;
    border:2px solid #3a424a; border-radius:8px; outline:none;
    text-align:center; letter-spacing:3px;
    font-family:inherit;
  }
  #lockInput:focus { border-color:#4ade80; box-shadow:0 0 12px rgba(74,222,128,0.3); }
  #lockError { color:#e74c3c; font-size:12px; margin-top:8px; min-height:16px; }
  .lk-btns { display:flex; gap:12px; margin-top:14px; justify-content:center; }
  .lk-btns button {
    padding:10px 22px; border-radius:7px; cursor:pointer;
    font-size:15px; font-weight:bold; font-family:inherit;
    touch-action: manipulation;
  }
  .lk-btns button:active { transform:scale(0.96); }
  #lockCancel { background:#2a3238; color:#a8b2bc; border:1px solid #4a525a; }
  #lockConfirm { background:#2ecc71; color:#0a1a0e; border:none; }
</style>
</head>
<body>

<div id="rotateHint">
  <div class="big">📱↻</div>
  <div>请把手机横过来</div>
  <div style="font-size:14px;color:#8a94a0;margin-top:10px;">横屏体验更佳</div>
</div>

<canvas id="game"></canvas>

<div id="lockPanel">
  <div class="lk-title">电子锁</div>
  <div class="lk-sub"><span class="lk-led"></span>已通电 · 请输入主管名字</div>
  <input id="lockInput" type="text" maxlength="10" autocomplete="off" />
  <div id="lockError"></div>
  <div class="lk-btns">
    <button id="lockCancel">取消</button>
    <button id="lockConfirm">确认</button>
  </div>
</div>

<script>
/* ================= 基础 ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 900, VH = 600;
cv.width = VW; cv.height = VH;
const MW = 1800, MH = 1300, WALL = 36;
let _seed = 20241030;
function sr(a,b){ _seed=(_seed*9301+49297)%233280; return a+(_seed/233280)*(b-a); }

/* ================= 音频 ================= */
let audioCtx=null, audioMaster=null, zapBus=null;
function ensureAudio(){
  if(audioCtx){ if(audioCtx.state==='suspended'){ try{audioCtx.resume();}catch(e){} } return; }
  const AC = window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{ audioCtx=new AC(); }catch(e){ audioCtx=null; return; }
  audioMaster=audioCtx.createGain(); audioMaster.gain.value=0.55; audioMaster.connect(audioCtx.destination);
  zapBus=audioCtx.createGain(); zapBus.gain.value=0; zapBus.connect(audioMaster);
  const buf=audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise=audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2800; bp.Q.value=0.9;
  const ng=audioCtx.createGain(); ng.gain.value=0.55;
  noise.connect(bp); bp.connect(ng); ng.connect(zapBus); noise.start();
  const hum=audioCtx.createOscillator(); hum.type='sawtooth'; hum.frequency.value=52;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
  const hg=audioCtx.createGain(); hg.gain.value=0.5;
  hum.connect(lp); lp.connect(hg); hg.connect(zapBus); hum.start();
}
function updateZapSound(){
  if(!audioCtx||!zapBus) return;
  let vol=0;
  if(!fuseBox.repaired && breakerSwitch.on && !dead){
    const d=Math.hypot(player.x-590, player.y-1015);
    const R=460;
    if(d<R){ let t=1-d/R; t=t*t; vol=t*0.42; }
  }
  try{ zapBus.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.06); }catch(e){}
}
function playTone(freq,dur,type,vol,delay,slideTo){
  if(!audioCtx||!audioMaster) return;
  const t0=audioCtx.currentTime+(delay||0);
  const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(audioMaster); o.start(t0); o.stop(t0+dur+0.05);
}
function sfxSuccess(){ if(!audioCtx) return;
  playTone(523.25,0.20,'triangle',0.20,0); playTone(659.25,0.20,'triangle',0.20,0.08);
  playTone(783.99,0.42,'triangle',0.22,0.16); }
function sfxFail(){ if(!audioCtx) return;
  playTone(320,0.16,'sawtooth',0.15,0); playTone(190,0.46,'sawtooth',0.17,0.11,85); }
function sfxBuzzShort(){ if(!audioCtx) return; playTone(140,0.13,'square',0.07,0,90); }
function sfxElectrocute(){
  sfxFail(); if(!audioCtx||!audioMaster) return;
  const t0=audioCtx.currentTime;
  const len=Math.floor(audioCtx.sampleRate*0.45);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const k=1-i/len; d[i]=(Math.random()*2-1)*k*k; }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.7;
  const g=audioCtx.createGain(); g.gain.value=0.28;
  src.connect(bp); bp.connect(g); g.connect(audioMaster); src.start(t0);
}
function sfxDoor(){
  if(!audioCtx||!audioMaster) return;
  const t0=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(72,t0); o.frequency.linearRampToValueAtTime(36,t0+1.4);
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(420,t0); lp.frequency.linearRampToValueAtTime(120,t0+1.4);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.30,t0+0.16);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+1.6);
  o.connect(lp); lp.connect(g); g.connect(audioMaster); o.start(t0); o.stop(t0+1.7);
  const len=Math.floor(audioCtx.sampleRate*1.6);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(900,t0); bp.frequency.linearRampToValueAtTime(280,t0+1.4); bp.Q.value=2;
  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(0.0001,t0);
  ng.gain.exponentialRampToValueAtTime(0.13,t0+0.3);
  ng.gain.exponentialRampToValueAtTime(0.0001,t0+1.5);
  src.connect(bp); bp.connect(ng); ng.connect(audioMaster); src.start(t0); src.stop(t0+1.6);
}

/* ================= 状态 ================= */
const solids=[], interactables=[];
const inventory=[
  {id:'flashlight',name:'手电筒',icon:'flashlight',type:'flashlight'},
  null,null,null,null,null
];
const INV_SIZE=6;
let torchEquipped=false;
const player={
  x:400,y:430,r:13,speed:220,
  face:{x:0,y:1}, walk:0, moving:false,
  wearingInsulation:false,
  target:null, pendingAction:null,
  arrivedRange:6, stuckTime:0
};
const camera={x:0,y:0};
let nearest=null, reading=null, photoView=null, toolboxView=null, hoverSlot=-1, time=0;
let clickMarker=null;
const puddle={x:120,y:880,w:460,h:310};
const breakerSwitch={x:640,y:920,w:30,h:46,on:true};
const fuseBox={x:700,y:1050,w:52,h:66,aged:true,repaired:false};
const gate={ x:MW-WALL-200, y:MH-WALL-40, w:160, h:WALL+40, side:'south' };
let powerRestored=false, toolboxUnlocked=false;
let lockDigits=[0,0,0,0];
const LOCK_PASSWORD=[0,4,2,2];
let dead=false, deathTimer=0, deathReason='';
let toastMessage=null, toastTimer=0;
let gamePhase='playing', phaseTimer=0, lockUIOpen=false, snapCv=null;
const lightCv=document.createElement('canvas');
lightCv.width=VW; lightCv.height=VH;
const lc=lightCv.getContext('2d');

/* ================= 提示按钮 & 小地图 ================= */
const HINT_BTN={ x:VW-100, y:12, w:86, h:34 };
const MAP_W=170, MAP_H=123;
const MAP_X=VW-MAP_W-14, MAP_Y=56;
const MAP_RECT={x:MAP_X,y:MAP_Y,w:MAP_W,h:MAP_H};
let showMap=false;
let mouseScreen={x:-999,y:-999};

/* ================= 工具 ================= */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function addSolid(x,y,w,h){ solids.push({x,y,w,h}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function showToast(t,d=3){ toastMessage=t; toastTimer=d; }
function updatePowerState(){ powerRestored=fuseBox.repaired&&breakerSwitch.on; }
function drawCloseBtn(rect,style){
  const cx=rect.x+rect.w/2, cy=rect.y+rect.h/2, R=rect.w/2;
  const hov=mouseScreen.x>=rect.x&&mouseScreen.x<=rect.x+rect.w&&
            mouseScreen.y>=rect.y&&mouseScreen.y<=rect.y+rect.h;
  ctx.save();
  ctx.fillStyle=hov?style.bgHover:style.bg;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=hov?style.ringHover:style.ring;
  ctx.lineWidth=hov?3:2.2;
  ctx.beginPath(); ctx.arc(cx,cy,R-1,0,Math.PI*2); ctx.stroke();
  const k=R*0.4;
  ctx.strokeStyle=hov?style.crossHover:style.cross;
  ctx.lineWidth=hov?4:3.2; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-k,cy-k); ctx.lineTo(cx+k,cy+k);
  ctx.moveTo(cx+k,cy-k); ctx.lineTo(cx-k,cy+k);
  ctx.stroke(); ctx.restore();
}

/* ================= 场景预渲染 ================= */
const sceneCv=document.createElement('canvas');
sceneCv.width=MW; sceneCv.height=MH;
const sc=sceneCv.getContext('2d');
function drawFloor(){
  sc.fillStyle='#2c3036'; sc.fillRect(0,0,MW,MH);
  sc.strokeStyle='rgba(0,0,0,0.28)'; sc.lineWidth=2;
  for(let x=0;x<=MW;x+=120){ sc.beginPath(); sc.moveTo(x,0); sc.lineTo(x,MH); sc.stroke(); }
  for(let y=0;y<=MH;y+=120){ sc.beginPath(); sc.moveTo(0,y); sc.lineTo(MW,y); sc.stroke(); }
  for(let i=0;i<80;i++){
    const x=sr(0,MW), y=sr(0,MH), r=sr(18,80);
    const g=sc.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,0.24)'); g.addColorStop(1,'rgba(0,0,0,0)');
    sc.fillStyle=g; sc.beginPath(); sc.arc(x,y,r,0,Math.PI*2); sc.fill();
  }
  sc.strokeStyle='rgba(186,142,28,0.42)'; sc.lineWidth=7;
  sc.beginPath(); sc.moveTo(WALL+50,640); sc.lineTo(MW-WALL-50,640); sc.stroke();
  sc.beginPath(); sc.moveTo(900,WALL+50); sc.lineTo(900,MH-WALL-50); sc.stroke();
  sc.strokeStyle='rgba(186,142,28,0.2)'; sc.lineWidth=3;
  for(let x=WALL+60;x<MW-WALL-60;x+=40){ sc.beginPath(); sc.moveTo(x,632); sc.lineTo(x+16,648); sc.stroke(); }
}
function drawWalls(){
  sc.fillStyle='#14171a';
  sc.fillRect(0,0,MW,WALL); sc.fillRect(0,MH-WALL,MW,WALL);
  sc.fillRect(0,0,WALL,MH); sc.fillRect(MW-WALL,0,WALL,MH);
  sc.strokeStyle='rgba(100,120,140,0.14)'; sc.lineWidth=3;
  sc.strokeRect(WALL-1.5,WALL-1.5,MW-WALL*2+3,MH-WALL*2+3);
  sc.fillStyle='#1e2328';
  for(let x=WALL+150;x<MW-WALL;x+=300){ sc.fillRect(x,0,34,WALL); sc.fillRect(x,MH-WALL,34,WALL); }
  for(let y=WALL+150;y<MH-WALL;y+=300){ sc.fillRect(0,y,WALL,34); sc.fillRect(MW-WALL,y,WALL,34); }
  addSolid(0,0,MW,WALL); addSolid(0,MH-WALL,MW,WALL);
  addSolid(0,0,WALL,MH); addSolid(MW-WALL,0,WALL,MH);
}
function drawPress(x,y,w,h){
  sc.fillStyle='#3d444c'; rr(sc,x,y,w,h,6); sc.fill();
  sc.strokeStyle='#545e68'; sc.lineWidth=2; rr(sc,x+1,y+1,w-2,h-2,5); sc.stroke();
  sc.fillStyle='#1a1e22'; rr(sc,x+w*0.22,y+h*0.26,w*0.56,h*0.48,4); sc.fill();
  sc.fillStyle='#2e353c'; rr(sc,x+w*0.33,y+h*0.36,w*0.34,h*0.28,3); sc.fill();
  sc.fillStyle='#b08818'; sc.fillRect(x+10,y+9,w-20,6);
  sc.fillStyle='#242a30'; rr(sc,x+w-36,y+h-48,28,40,3); sc.fill();
  sc.fillStyle='#2ecc71'; sc.beginPath(); sc.arc(x+w-22,y+h-38,3.2,0,Math.PI*2); sc.fill();
  sc.fillStyle='#e74c3c'; sc.beginPath(); sc.arc(x+w-22,y+h-27,3.2,0,Math.PI*2); sc.fill();
  sc.fillStyle='#f1c40f'; sc.beginPath(); sc.arc(x+w-22,y+h-16,3.2,0,Math.PI*2); sc.fill();
  addSolid(x,y,w,h);
}
function drawConveyor(x,y,w,h){
  sc.fillStyle='#2e343a'; rr(sc,x,y,w,h,5); sc.fill();
  sc.strokeStyle='#3e464e'; sc.lineWidth=2; rr(sc,x+1,y+1,w-2,h-2,4); sc.stroke();
  sc.fillStyle='#161a1e'; rr(sc,x+7,y+9,w-14,h-18,3); sc.fill();
  sc.strokeStyle='#2c343c'; sc.lineWidth=3;
  for(let i=x+20;i<x+w-14;i+=18){ sc.beginPath(); sc.moveTo(i,y+11); sc.lineTo(i,y+h-11); sc.stroke(); }
  sc.fillStyle='#454d55';
  sc.beginPath(); sc.arc(x+13,y+h/2,h/2-7,0,Math.PI*2); sc.fill();
  sc.beginPath(); sc.arc(x+w-13,y+h/2,h/2-7,0,Math.PI*2); sc.fill();
  sc.fillStyle='#20262c';
  sc.beginPath(); sc.arc(x+13,y+h/2,4,0,Math.PI*2); sc.fill();
  sc.beginPath(); sc.arc(x+w-13,y+h/2,4,0,Math.PI*2); sc.fill();
  addSolid(x,y,w,h);
}
function drawCabinet(x,y,w,h){
  sc.fillStyle='#374049'; rr(sc,x,y,w,h,4); sc.fill();
  sc.strokeStyle='#4a5762'; sc.lineWidth=2; rr(sc,x+1,y+1,w-2,h-2,3); sc.stroke();
  sc.fillStyle='#1e242a'; rr(sc,x+9,y+9,w-18,h-18,3); sc.fill();
  const lights=['#2ecc71','#e74c3c','#f1c40f','#3498db'];
  for(let i=0;i<4;i++){ sc.fillStyle=lights[i]; sc.beginPath(); sc.arc(x+20+i*15,y+h/2,4,0,Math.PI*2); sc.fill(); }
  addSolid(x,y,w,h);
}
function drawBench(x,y,w,h){
  sc.fillStyle='#4a3c2a'; rr(sc,x,y,w,h,4); sc.fill();
  sc.strokeStyle='#634f36'; sc.lineWidth=2; rr(sc,x+1,y+1,w-2,h-2,3); sc.stroke();
  sc.strokeStyle='rgba(0,0,0,0.15)'; sc.lineWidth=1;
  for(let i=y+13;i<y+h;i+=13){ sc.beginPath(); sc.moveTo(x+4,i); sc.lineTo(x+w-4,i); sc.stroke(); }
  sc.strokeStyle='#7a848d'; sc.lineWidth=5; sc.lineCap='round';
  sc.beginPath(); sc.moveTo(x+24,y+h/2); sc.lineTo(x+62,y+h/2); sc.stroke();
  sc.lineWidth=3; sc.beginPath(); sc.arc(x+18,y+h/2,7,0.7,5.6); sc.stroke();
  sc.fillStyle='#565e68';
  sc.beginPath(); sc.arc(x+100,y+h/2-7,6,0,Math.PI*2); sc.fill();
  sc.beginPath(); sc.arc(x+120,y+h/2+5,5,0,Math.PI*2); sc.fill();
  sc.fillStyle='#8e2f24'; rr(sc,x+w-66,y+h/2-11,28,22,4); sc.fill();
  sc.fillRect(x+w-52,y+h/2-20,7,11);
  addSolid(x,y,w,h);
}
function drawRack(x,y,w,h){
  sc.fillStyle='#2c343e'; rr(sc,x,y,w,h,4); sc.fill();
  sc.strokeStyle='#3d4854'; sc.lineWidth=2; rr(sc,x+1,y+1,w-2,h-2,3); sc.stroke();
  const cols=Math.floor(w/76); const cw=w/cols;
  const colors=['#6a4e2a','#4e3a6a','#2a4e6a','#6a2a2a','#3a5e3a','#5e5e2a'];
  for(let i=0;i<cols;i++){
    const bx=x+i*cw+9, by=y+11, bw=cw-18, bh=h-22;
    sc.fillStyle=colors[Math.floor(sr(0,colors.length))%colors.length];
    rr(sc,bx,by,bw,bh,3); sc.fill();
    sc.fillStyle='rgba(255,255,255,0.12)'; sc.fillRect(bx+bw/2-3,by,6,bh);
    sc.strokeStyle='rgba(0,0,0,0.35)'; sc.lineWidth=1.5; rr(sc,bx,by,bw,bh,3); sc.stroke();
  }
  addSolid(x,y,w,h);
}
function drawBarrel(x,y,r){
  sc.fillStyle='rgba(0,0,0,0.32)';
  sc.beginPath(); sc.ellipse(x,y+r*0.35,r*1.05,r*0.6,0,0,Math.PI*2); sc.fill();
  sc.fillStyle='#5e3822'; sc.beginPath(); sc.arc(x,y,r,0,Math.PI*2); sc.fill();
  sc.strokeStyle='#422617'; sc.lineWidth=3; sc.stroke();
  sc.strokeStyle='#74442a'; sc.lineWidth=2;
  sc.beginPath(); sc.arc(x,y,r-6,0,Math.PI*2); sc.stroke();
  sc.beginPath();
  sc.moveTo(x-r*0.68,y); sc.lineTo(x+r*0.68,y);
  sc.moveTo(x,y-r*0.68); sc.lineTo(x,y+r*0.68);
  sc.stroke();
  sc.fillStyle='rgba(255,255,255,0.12)';

function drawPlayer(c){
  const x=player.x, y=player.y;
  const swing=player.moving?Math.sin(player.walk)*5:0;
  const fx=player.face.x, fy=player.face.y;
  const px=-fy, py=fx;
  const ins=player.wearingInsulation;
  const handColor=ins?'#c86a18':'#173a56';
  const bodyColor=ins?'#e87a20':'#24507a';
  const bodyStroke=ins?'#b85a10':'#173a56';
  const stripeColor=ins?'rgba(230,240,250,0.85)':'rgba(170,210,240,0.5)';
  c.fillStyle='rgba(0,0,0,0.4)';
  c.beginPath(); c.ellipse(x,y+7,15,9,0,0,Math.PI*2); c.fill();
  if(torchEquipped){
    const tx=x+fx*16+px*6, ty=y+fy*16+py*6;
    c.fillStyle=handColor; c.beginPath(); c.arc(tx,ty,5.5,0,Math.PI*2); c.fill();
    c.save(); c.translate(tx,ty); c.rotate(Math.atan2(fy,fx));
    c.fillStyle='#3a4048'; rr(c,-8,-4,14,8,2); c.fill();
    c.fillStyle='rgba(255,220,100,0.95)';
    c.beginPath(); c.ellipse(11,0,2.5,6,0,0,Math.PI*2); c.fill();
    c.restore();
    c.fillStyle=handColor;
    c.beginPath();
    c.arc(x-px*13-fx*swing,y-py*13-fy*swing,5.5,0,Math.PI*2); c.fill();
  } else {
    c.fillStyle=handColor;
    c.beginPath();
    c.arc(x+px*13+fx*swing,y+py*13+fy*swing,5.5,0,Math.PI*2); c.fill();
    c.beginPath();
    c.arc(x-px*13-fx*swing,y-py*13-fy*swing,5.5,0,Math.PI*2); c.fill();
  }
  c.fillStyle=bodyColor;
  c.beginPath(); c.ellipse(x,y,13.5,11.5,0,0,Math.PI*2); c.fill();
  c.strokeStyle=bodyStroke; c.lineWidth=2; c.stroke();
  c.strokeStyle=stripeColor; c.lineWidth=2.5;
  c.beginPath(); c.moveTo(x-10,y-2); c.lineTo(x+10,y-2); c.stroke();
  if(ins){ c.beginPath(); c.moveTo(x-9,y+4); c.lineTo(x+9,y+4); c.stroke(); }
  c.fillStyle=ins?'#f0a020':'#e0b81c';
  c.beginPath(); c.arc(x,y-2,10,0,Math.PI*2); c.fill();
  c.strokeStyle=ins?'#c88010':'#b8940e'; c.lineWidth=2; c.stroke();
  c.fillStyle=ins?'#d89018':'#c9a112';
  c.beginPath();
  c.ellipse(x+fx*7,y-2+fy*7,7.5,4.5,Math.atan2(fy,fx),0,Math.PI*2); c.fill();
  c.strokeStyle=ins?'rgba(150,95,10,0.85)':'rgba(140,108,10,0.85)';
  c.lineWidth=2;
  c.beginPath(); c.moveTo(x-6,y-2); c.lineTo(x+6,y-2); c.stroke();
}

function readingLayout(){

    prev:{x:X+44,y:Y+H-62,w:124,h:38},
    next:{x:X+W-168,y:Y+H-62,w:124,h:38},
    close:{x:X+W-62,y:Y+12,w:50,h:50} };

function wrapText(c,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    if(para===''){ out.push(''); continue; }
    let line='';
    for(const ch of para){
      const test=line+ch;
      if(c.measureText(test).width>maxW&&line!==''){ out.push(line); line=ch; }
      else line=test;
    }
    if(line!=='') out.push(line);
  }
  return out;
}
function drawReading(){
  const L=readingLayout();
  ctx.fillStyle='rgba(0,0,0,0.86)'; ctx.fillRect(0,0,VW,VH);

  ctx.restore();

  ctx.strokeStyle='rgba(100,78,48,0.38)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(L.X+56,L.Y+68); ctx.lineTo(L.X+L.W-42,L.Y+68); ctx.stroke();

function drawWoman(c,x,baseY,index,scale){
  const heights=[1.0,0.95,1.02,0.93,0.98];
  const faces=['#d4b896','#c8a878','#d8bc98','#c4a070','#d0b080'];
  const hairs=['#1a0a00','#2a1a0a','#0a0a0a','#1a0a00','#2a1a0a'];
  const h=76*scale*heights[index], bodyW=32*scale*heights[index];
  const bodyH=h*0.58, bodyY=baseY-bodyH, headR=13*scale*heights[index];
  c.fillStyle='#2a3a5a';
  c.beginPath();
  c.moveTo(x-bodyW/2,baseY); c.lineTo(x+bodyW/2,baseY);
  c.lineTo(x+bodyW*0.34,bodyY); c.lineTo(x-bodyW*0.34,bodyY);
  c.closePath(); c.fill();
  c.fillStyle='#1a2a4a';
  c.beginPath();
  c.moveTo(x-7*scale,bodyY); c.lineTo(x+7*scale,bodyY); c.lineTo(x,bodyY+9*scale);
  c.closePath(); c.fill();
  const headY=bodyY-headR+3*scale;
  c.fillStyle=faces[index];
  c.beginPath(); c.arc(x,headY,headR,0,Math.PI*2); c.fill();
  c.fillStyle=hairs[index];
  c.beginPath(); c.arc(x,headY-2*scale,headR+1.5*scale,Math.PI*0.95,Math.PI*2.05); c.fill();
  c.fillStyle='#c9a227';
  c.beginPath(); c.arc(x,headY-4*scale,headR+4*scale,Math.PI,0); c.fill();
  c.fillStyle='#1a1a1a';
  c.beginPath(); c.arc(x-4.5*scale,headY,1.6*scale,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+4.5*scale,headY,1.6*scale,0,Math.PI*2); c.fill();
  c.strokeStyle='#8a5a3a'; c.lineWidth=1.2*scale;
  c.beginPath(); c.arc(x,headY+4.5*scale,4.5*scale,0.25,Math.PI-0.25); c.stroke();
}
function drawPhotoFront(c,P){

function lockLayout(){
  const W=400, H=480;
  const X=(VW-W)/2, Y=(VH-H)/2;
  const digitW=64, digitGap=18;
  const total=4*digitW+3*digitGap;
  const sx=X+(W-total)/2;
  const dy=Y+180, dh=96;
  const digits=[];
  for(let i=0;i<4;i++){
    const dx=sx+i*(digitW+digitGap);
    digits.push({
      x:dx,y:dy,w:digitW,h:dh,
      up:{x:dx+digitW/2-18,y:dy-54,w:36,h:36},
      down:{x:dx+digitW/2-18,y:dy+dh+18,w:36,h:36}
    });
  }
  return { X,Y,W,H,digits, close:{x:X+W-62,y:Y+12,w:50,h:50} };
}
function checkPassword(){
  if(lockDigits[0]===LOCK_PASSWORD[0]&&lockDigits[1]===LOCK_PASSWORD[1]&&
     lockDigits[2]===LOCK_PASSWORD[2]&&lockDigits[3]===LOCK_PASSWORD[3]){
    if(!toolboxUnlocked) sfxSuccess();
    toolboxUnlocked=true;
    if(toolboxView) toolboxView.locked=false;
    return true;
  }
  return false;
}
function drawLockView(){
  const L=lockLayout();
  ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,VW,VH);

/* ================= 积水区 ================= */
function drawPuddle(){
  const cx=puddle.x+puddle.w/2, cy=puddle.y+puddle.h/2;
  const rx=puddle.w/2, ry=puddle.h/2;
  const g=ctx.createRadialGradient(cx,cy,20,cx,cy,puddle.w*0.7);
  g.addColorStop(0,'rgba(22,50,68,0.92)');
  g.addColorStop(0.6,'rgba(16,38,54,0.85)');
  g.addColorStop(1,'rgba(10,28,42,0.5)');
  ctx.fillStyle=g;
  ctx.beginPath();
  const pts=48;
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*Math.PI*2;
    const noise=1+Math.sin(a*5+time*0.6)*0.035+Math.sin(a*9+time*0.4)*0.025;
    const x=cx+Math.cos(a)*rx*noise, y=cy+Math.sin(a)*ry*noise;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(110,170,210,0.16)'; ctx.lineWidth=1.4;
  for(let i=0;i<6;i++){
    const t=time*0.5+i*0.9, r2=22+i*30;
    ctx.globalAlpha=0.18*(1-i/6)*(0.6+Math.sin(t)*0.4);
    ctx.beginPath(); ctx.ellipse(cx,cy,r2,r2*0.55,0,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ================= 碰撞 & 寻路 ================= */
function collides(cx,cy){
  const r=player.r;
  const bx=cx-r, by=cy-r, bw=r*2, bh=r*2;
  for(const s of solids){
    if(bx<s.x+s.w&&bx+bw>s.x&&by<s.y+s.h&&by+bh>s.y) return true;
  }
  return false;
}
function findWalkable(x,y){
  if(!collides(x,y)&&x>WALL+20&&x<MW-WALL-20&&y>WALL+20&&y<MH-WALL-20) return {x,y};
  for(let r=15;r<=120;r+=15){
    for(let a=0;a<Math.PI*2;a+=Math.PI/12){
      const tx=x+Math.cos(a)*r, ty=y+Math.sin(a)*r;
      if(tx<WALL+20||tx>MW-WALL-20) continue;
      if(ty<WALL+20||ty>MH-WALL-20) continue;
      if(!collides(tx,ty)) return {x:tx,y:ty};
    }
  }
  return null;
}

/* ================= 动作 ================= */
function executeAction(action){
  if(action.type==='pickup'){
    const it=action.item;
    if(it.taken) return;
    if(Math.hypot(it.x-player.x,it.y-player.y)<80){
      const idx=inventory.indexOf(null);
      if(idx!==-1){ it.taken=true; inventory[idx]=it; sfxSuccess(); }
    }
  } else if(action.type==='breaker'){
    const bdx=player.x-(breakerSwitch.x+breakerSwitch.w/2);
    const bdy=player.y-(breakerSwitch.y+breakerSwitch.h/2);
    if(Math.hypot(bdx,bdy)<80){
      if(!player.wearingInsulation){
        dead=true; deathTimer=0; deathReason='breaker'; sfxElectrocute(); return;
      }
      breakerSwitch.on=!breakerSwitch.on; updatePowerState();
    }
  } else if(action.type==='fusebox'){
    const fdx=player.x-(fuseBox.x+fuseBox.w/2);
    const fdy=player.y-(fuseBox.y+fuseBox.h/2);
    if(Math.hypot(fdx,fdy)<80){
      if(fuseBox.repaired) return;
      if(!player.wearingInsulation||breakerSwitch.on){
        dead=true; deathTimer=0; deathReason='fusebox'; sfxElectrocute(); return;
      }
      if(!hasToolbox()||!toolboxUnlocked||!hasWire()){
        showToast('需要携带工具和电线，工具箱需要打开'); return;
      }
      fuseBox.repaired=true; fuseBox.aged=false; removeWire();
      updatePowerState(); sfxSuccess();
    }
  } else if(action.type==='gate'){
    const gcx=gate.x+gate.w/2, gcy=gate.y+gate.h/2;
    if(Math.hypot(player.x-gcx,player.y-gcy)<180){
      if(!powerRestored){ showToast('电子锁未通电'); return; }
      openLockUI();
    }
  }
}

/* ================= 更新 ================= */
function update(dt){
  time+=dt;
  if(toastTimer>0){ toastTimer-=dt; if(toastTimer<=0) toastMessage=null; }
  updateZapSound();
  if(clickMarker){ clickMarker.t-=dt; if(clickMarker.t<=0) clickMarker=null; }

  if(gamePhase==='transition'){
    phaseTimer+=dt;
    if(phaseTimer>=3){ gamePhase='outro'; phaseTimer=0; }
    return;
  }
  if(gamePhase==='outro'){
    phaseTimer+=dt;
    if(phaseTimer>=5){ gamePhase='gameover'; phaseTimer=0; }
    return;
  }
  if(gamePhase==='gameover'){ phaseTimer+=dt; return; }

  if(dead){
    deathTimer+=dt;
    if(deathTimer>2.8){
      player.x=400; player.y=430;
      player.face.x=0; player.face.y=1;
      player.target=null; player.pendingAction=null;
      dead=false; deathTimer=0; deathReason='';
    }
    return;
  }
  if(reading||photoView||toolboxView||lockUIOpen){
    player.moving=false; nearest=null; return;
  }

  if(player.target){
    const tx=player.target.x, ty=player.target.y;
    const dx=tx-player.x, dy=ty-player.y;
    const d=Math.hypot(dx,dy);
    const range=player.arrivedRange||6;
    if(d<=range){
      player.target=null; player.moving=false;
      const act=player.pendingAction; player.pendingAction=null;
      if(act) executeAction(act);
    } else {
      const step=Math.min(player.speed*dt, d);
      const nx=dx/d*step, ny=dy/d*step;
      const ox=player.x, oy=player.y;
      if(!collides(player.x+nx,player.y)) player.x+=nx;
      if(!collides(player.x,player.y+ny)) player.y+=ny;
      if(Math.abs(player.x-ox)<0.05 && Math.abs(player.y-oy)<0.05){
        player.stuckTime+=dt;
        if(player.stuckTime>0.35){
          player.target=null; player.pendingAction=null;
          player.stuckTime=0; player.moving=false;
        }
      } else {
        player.stuckTime=0; player.moving=true; player.walk+=dt*9;
        player.face.x=nx/step; player.face.y=ny/step;
      }
    }
  } else {
    player.moving=false; player.walk*=0.85;
  }

  camera.x=clamp(player.x-VW/2,0,MW-VW);
  camera.y=clamp(player.y-VH/2,0,MH-VH);

  if(!fuseBox.repaired&&breakerSwitch.on&&!player.wearingInsulation){
    if(player.x>puddle.x&&player.x<puddle.x+puddle.w&&
       player.y>puddle.y&&player.y<puddle.y+puddle.h){
      dead=true; deathTimer=0; deathReason='puddle';
      player.target=null; player.pendingAction=null;
      sfxElectrocute(); return;
    }
  }
}

  ctx.beginPath(); ctx.arc(pp.x,pp.y,3.6,0,Math.PI*2); ctx.stroke();
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';

}

/* ================= 渲染 ================= */
function render(){
  if(gamePhase==='transition'){ renderTransition(); return; }
  if(gamePhase==='outro'||gamePhase==='gameover'){
    renderOutro();
    if(gamePhase==='gameover'){
      const t=Math.min(phaseTimer/1.2,1);
      ctx.fillStyle=`rgba(0,0,0,${t*0.85})`;
      ctx.fillRect(0,0,VW,VH);
      ctx.globalAlpha=t;
      ctx.fillStyle='#e4dac0';
      ctx.font='bold 48px "STSong", "SimSun", system-ui, serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('游戏结束',VW/2,VH/2-10);
      ctx.font='18px system-ui, sans-serif';
      ctx.fillStyle='rgba(180,200,220,0.8)';
      ctx.fillText('你已成功离开三分厂',VW/2,VH/2+50);
      ctx.textBaseline='alphabetic'; ctx.textAlign='left';
      ctx.globalAlpha=1;
    }
    return;
  }
  ctx.drawImage(sceneCv,camera.x,camera.y,VW,VH,0,0,VW,VH);
  ctx.save();
  ctx.translate(-camera.x,-camera.y);
  drawPuddle();
  drawLeakDevice();
  drawBreakerSwitch(ctx);
  drawFuseBox(ctx);
  drawGate(ctx);
  for(const it of interactables) drawWorldItem(ctx,it);
  drawPlayer(ctx);
  if(clickMarker){
    const a=clickMarker.t/0.6;
    ctx.strokeStyle=`rgba(255,220,100,${a*0.85})`;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(clickMarker.x,clickMarker.y,16*(1.3-a*0.6),0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=`rgba(255,220,100,${a*0.5})`;
    ctx.beginPath(); ctx.arc(clickMarker.x,clickMarker.y,4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  renderLighting();
  ctx.save();
  ctx.translate(-camera.x,-camera.y);
  ctx.globalCompositeOperation='lighter';
  drawElectricArcs();
  ctx.restore();
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.4,VW/2,VH/2,VH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(200,220,240,0.45)';
  ctx.font='bold 16px system-ui, sans-serif';
  ctx.textAlign='left';
  ctx.fillText('密室逃脱 · 三分厂',22,32);
  ctx.fillStyle='rgba(160,185,210,0.22)';
  ctx.font='11px system-ui, sans-serif';
  ctx.fillText('ESCAPE · THE THIRD WORKSHOP',22,48);
  if(powerRestored){
    ctx.fillStyle='rgba(46,204,113,0.7)';
    ctx.font='bold 13px system-ui, sans-serif';
    ctx.fillText('⚡ 电力已恢复',22,68);
  }
  drawInventory();
  if(!reading&&!photoView&&!toolboxView&&!lockUIOpen&&!dead){
    drawHintButton();
    drawMiniMap();
  }
  if(reading) drawReading();
  if(photoView) drawPhotoView();
  if(toolboxView){
    if(toolboxView.locked) drawLockView();
    else drawToolboxContent();
  }
  if(dead){
    const flash=(Math.sin(deathTimer*26)+1)/2;
    ctx.fillStyle=`rgba(120,200,255,${flash*0.35})`;
    ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle=`rgba(220,240,255,${0.55+flash*0.45})`;
    ctx.font='bold 52px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('触　电',VW/2,VH/2-24);
    ctx.font='17px system-ui, sans-serif';
    ctx.fillStyle=`rgba(190,225,255,${0.5+flash*0.5})`;
    let sub='高压危险 · 请勿涉水';
    if(deathReason==='puddle') sub='积水带电 · 请穿绝缘服';
    if(deathReason==='fusebox') sub='线路老化 · 需穿绝缘服并拉下电闸';
    if(deathReason==='breaker') sub='带电操作 · 需穿绝缘服';
    ctx.fillText(sub,VW/2,VH/2+42);
    ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  }
  drawToast();
}

/* ================= 过渡 ================= */
function renderTransition(){
  if(!snapCv){ ctx.fillStyle='#000'; ctx.fillRect(0,0,VW,VH); return; }
  const t=Math.min(phaseTimer/3,1);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.filter=`blur(${1+t*22}px)`;
  ctx.drawImage(snapCv,0,0);
  ctx.restore();
  ctx.filter='none';
  if(t>0.7){
    const ft=(t-0.7)/0.3;
    ctx.fillStyle=`rgba(0,0,0,${ft*0.9})`;
    ctx.fillRect(0,0,VW,VH);
  }
}

function renderOutro(){
  const t=Math.min(phaseTimer/1.2,1);
  const skyGrad=ctx.createLinearGradient(0,0,0,VH*0.85);

  const clouds=[
    {x:0.05,y:0.09,s:1.10,v:0.010},
    {x:0.33,y:0.05,s:0.75,v:0.014},
    {x:0.58,y:0.13,s:1.25,v:0.007},
    {x:0.82,y:0.07,s:0.90,v:0.012},
    {x:0.18,y:0.21,s:0.60,v:0.016},
    {x:0.70,y:0.22,s:0.70,v:0.009}

  clouds.forEach(c=>{
    const cx=((c.x*VW+time*c.v*VW)%(VW+400))-200;

  });
  const groundY=VH*0.72;

  ctx.fillStyle='#7d858c';
  ctx.beginPath();
  ctx.moveTo(bx-20,by); ctx.lineTo(bx+bw/2,by-50); ctx.lineTo(bx+bw+20,by);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#6f777e';
  ctx.fillRect(bx+bw*0.18,by-22,26,22);
  ctx.fillRect(bx+bw*0.70,by-22,26,22);
  for(let i=0;i<6;i++){

    ctx.lineTo(wx+ww-2,wy+wh*0.42); ctx.lineTo(wx+ww*0.5,wy+wh-2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#3f4a54'; ctx.lineWidth=2;

  }
  const dx=VW/2-55, dy=groundY-80, dw=110, dh=80;

  dg.addColorStop(0,'#2b3138'); dg.addColorStop(1,'#171b20');

  ctx.beginPath();
  ctx.moveTo(dx,dy); ctx.lineTo(dx-60,dy+10);

  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#5d646b'; ctx.lineWidth=3;
  ctx.strokeRect(dx-2,dy-2,dw+4,dh+4);
  // 招牌
  const sw=140, sh=26;
  const sx=dx+dw/2-sw/2, sy=dy-34;
  const sg=ctx.createLinearGradient(sx,sy,sx,sy+sh);
  sg.addColorStop(0,'#1a5a30'); sg.addColorStop(1,'#0e3a1e');

  ctx.beginPath(); ctx.ellipse(dx+dw/2,groundY+30,220,70,0,0,Math.PI*2); ctx.fill();

  ctx.fillText('三分厂门口',VW/2,110);

  ctx.globalAlpha=1;
}

/* ================= 辅助 ================= */
function hasToolbox(){ return inventory.some(it=>it&&it.id==='toolbox'); }
function hasWire(){ return inventory.some(it=>it&&it.id==='wire'); }

/* ================= 电子锁 UI ================= */
const lockPanel=document.getElementById('lockPanel');
const lockInput=document.getElementById('lockInput');
const lockError=document.getElementById('lockError');
const lockCancel=document.getElementById('lockCancel');
const lockConfirm=document.getElementById('lockConfirm');

function openLockUI(){
  lockUIOpen=true;
  lockInput.value='';
  lockError.textContent='';
  lockPanel.style.display='block';
  setTimeout(()=>lockInput.focus(),50);
}
function closeLockUI(){
  lockUIOpen=false;
  lockPanel.style.display='none';
  lockInput.value='';
  lockError.textContent='';
}
function submitLock(){
  const v=lockInput.value.trim();
  if(v==='陈敏军'){
    sfxSuccess(); closeLockUI(); startTransition();
  } else {
    lockError.textContent='名字错误';
    lockInput.value=''; lockInput.focus();
    sfxFail();
  }
}
function startTransition(){
  snapCv=document.createElement('canvas');
  snapCv.width=VW; snapCv.height=VH;
  snapCv.getContext('2d').drawImage(cv,0,0);
  gamePhase='transition';
  phaseTimer=0;
  sfxDoor();
}
lockConfirm.addEventListener('click',submitLock);
lockCancel.addEventListener('click',closeLockUI);
lockInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); submitLock(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeLockUI(); }
  e.stopPropagation();
});

/* ================= 输入（触屏 + 鼠标统一） ================= */
function mousePos(e){
  const r=cv.getBoundingClientRect();
  let cx, cy;
  if(e.touches && e.touches.length){
    cx=e.touches[0].clientX; cy=e.touches[0].clientY;
  } else if(e.changedTouches && e.changedTouches.length){
    cx=e.changedTouches[0].clientX; cy=e.changedTouches[0].clientY;
  } else {
    cx=e.clientX; cy=e.clientY;
  }
  return {
    x:(cx-r.left)*(VW/r.width),
    y:(cy-r.top)*(VH/r.height)
  };
}

function handlePointer(m){
  if(dead) return;
  if(gamePhase!=='playing') return;
  if(lockUIOpen) return;

  // 模态界面
  if(reading){
    const L=readingLayout();
    if(inRect(m,L.close)){ reading=null; return; }
    if(inRect(m,L.prev)&&reading.page>0){ reading.page--; return; }
    if(inRect(m,L.next)&&reading.page<reading.item.pages.length-1){ reading.page++; return; }
    return;
  }
  if(photoView){
    const L=photoViewLayout();
    if(inRect(m,L.close)){ photoView=null; return; }
    if(inRect(m,L.photo)){ photoView.flipped=!photoView.flipped; return; }
    return;
  }
  if(toolboxView){
    if(toolboxView.locked){
      const L=lockLayout();
      if(inRect(m,L.close)){ toolboxView=null; return; }
      for(let i=0;i<4;i++){
        let ch=false;
        if(inRect(m,L.digits[i].up)){ lockDigits[i]=(lockDigits[i]+1)%10; ch=true; }
        else if(inRect(m,L.digits[i].down)){ lockDigits[i]=(lockDigits[i]+9)%10; ch=true; }
        if(ch){ if(!checkPassword()) sfxBuzzShort(); return; }
      }
      return;
    } else {
      const L=toolboxLayout();
      if(inRect(m,L.close)){ toolboxView=null; }
      return;
    }
  }

  // 提示 / 小地图
  if(inRect(m,HINT_BTN)){ showMap=!showMap; return; }
  if(showMap && inRect(m,MAP_RECT)) return;

  // 背包
  for(let i=0;i<INV_SIZE;i++){
    if(inRect(m,invSlotRect(i)) && inventory[i]){
      const it=inventory[i];
      if(it.type==='flashlight') torchEquipped=!torchEquipped;
      else if(it.type==='photo') photoView={flipped:false};
      else if(it.type==='toolbox') toolboxView={item:it,locked:!toolboxUnlocked};
      else if(it.type==='wearable') player.wearingInsulation=!player.wearingInsulation;
      else if(it.pages) reading={item:it,page:0};
      return;
    }
  }

  // 世界点击
  const wx=m.x+camera.x, wy=m.y+camera.y;

  // 物品
  for(const it of interactables){
    if(it.taken) continue;
    if(Math.hypot(it.x-wx,it.y-wy)<40){
      const dest=findWalkable(it.x,it.y+36)||findWalkable(it.x,it.y);
      if(dest){
        player.target=dest;
        player.pendingAction={type:'pickup',item:it};
        player.arrivedRange=40;
        player.stuckTime=0;
        clickMarker={x:dest.x,y:dest.y,t:0.6};
      }
      return;
    }
  }
  // 电闸
  {
    const bdx=wx-(breakerSwitch.x+breakerSwitch.w/2);
    const bdy=wy-(breakerSwitch.y+breakerSwitch.h/2);
    if(Math.hypot(bdx,bdy)<60){
      const dest=findWalkable(breakerSwitch.x+breakerSwitch.w/2,breakerSwitch.y+breakerSwitch.h+40);
      if(dest){
        player.target=dest;
        player.pendingAction={type:'breaker'};
        player.arrivedRange=40;
        player.stuckTime=0;
        clickMarker={x:dest.x,y:dest.y,t:0.6};
      }
      return;
    }
  }
  // 配电箱
  {
    const fdx=wx-(fuseBox.x+fuseBox.w/2);
    const fdy=wy-(fuseBox.y+fuseBox.h/2);
    if(Math.hypot(fdx,fdy)<60){
      const dest=findWalkable(fuseBox.x+fuseBox.w/2,fuseBox.y-40);
      if(dest){
        player.target=dest;
        player.pendingAction={type:'fusebox'};
        player.arrivedRange=40;
        player.stuckTime=0;
        clickMarker={x:dest.x,y:dest.y,t:0.6};
      }
      return;
    }
  }
  // 大门
  {
    const gsx=gate.x-camera.x, gsy=gate.y-camera.y;
    if(m.x>=gsx-20 && m.x<=gsx+gate.w+20 &&
       m.y>=gsy-46 && m.y<=gsy+gate.h+20){
      const dest=findWalkable(gate.x+gate.w/2,gate.y-40);
      if(dest){
        player.target=dest;
        player.pendingAction={type:'gate'};
        player.arrivedRange=40;
        player.stuckTime=0;
        clickMarker={x:dest.x,y:dest.y,t:0.6};
      }
      return;
    }
  }
  // 地面
  const tx=clamp(wx,WALL+22,MW-WALL-22);
  const ty=clamp(wy,WALL+22,MH-WALL-22);
  const dest=findWalkable(tx,ty);
  if(dest){
    player.target=dest;
    player.pendingAction=null;
    player.arrivedRange=6;
    player.stuckTime=0;
    clickMarker={x:dest.x,y:dest.y,t:0.6};
  }
}

// 触摸/鼠标事件
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  ensureAudio();
  handlePointer(mousePos(e));
}, {passive:false});

cv.addEventListener('touchstart', e=>{
  if(e.touches.length>1) return;
  e.preventDefault();
  ensureAudio();
  handlePointer(mousePos(e));
}, {passive:false});

cv.addEventListener('mousedown', e=>{
  ensureAudio();
  handlePointer(mousePos(e));
});

cv.addEventListener('mousemove', e=>{
  const m=mousePos(e);
  mouseScreen=m;
  if(gamePhase!=='playing'){ cv.style.cursor='default'; return; }
  hoverSlot=-1;
  let pointer=false;
  if(reading){
    const L=readingLayout();
    if(inRect(m,L.prev)||inRect(m,L.next)||inRect(m,L.close)) pointer=true;
  } else if(photoView){
    const L=photoViewLayout();
    if(inRect(m,L.close)||inRect(m,L.photo)) pointer=true;
  } else if(toolboxView){
    if(toolboxView.locked){
      const L=lockLayout();
      if(inRect(m,L.close)) pointer=true;
      else for(let i=0;i<4;i++){
        if(inRect(m,L.digits[i].up)||inRect(m,L.digits[i].down)){ pointer=true; break; }
      }
    } else {
      const L=toolboxLayout();
      if(inRect(m,L.close)) pointer=true;
    }
  } else if(!dead){
    if(inRect(m,HINT_BTN)) pointer=true;
    if(showMap && inRect(m,MAP_RECT)) pointer=true;
    if(!pointer){
      for(let i=0;i<INV_SIZE;i++){
        if(inRect(m,invSlotRect(i)) && inventory[i]){ hoverSlot=i; pointer=true; break; }
      }
    }
  }
  cv.style.cursor=pointer?'pointer':'default';
});

// 阻止双击缩放
let lastTouch=0;
cv.addEventListener('touchend', e=>{
  const now=Date.now();
  if(now-lastTouch<300) e.preventDefault();
  lastTouch=now;
}, {passive:false});

/* ================= 主循环 ================= */
let last=0;
function loop(ts){
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
